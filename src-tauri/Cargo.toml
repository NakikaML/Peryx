[package]
name = "peryx"
version = "0.2.1"
description = "Peryx 栖知 - 个性化 Markdown 学习笔记软件"
authors = ["Peryx"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "peryx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
